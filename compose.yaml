services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: graveyard
      POSTGRES_USER: playground
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - graveyard:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playground -d graveyard"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  graveyard:
